<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Арена Доджо — панель тренера</title>
    <meta name="description" content="Прототип панели тренера для тематических турниров по тхэквондо: участники, карточки, заявка в Excel.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" defer></script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <div class="bg" aria-hidden="true"></div>

    <header class="top">
        <button type="button" class="btn btn-print" id="printBtn" title="Сформировать заявку в Excel для приёмной комиссии">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/><circle cx="17.5" cy="12" r=".8" fill="currentColor"/></svg>
            <span class="btn-label" data-text="print">Печать заявки</span>
            <span class="badge" id="printCount" hidden>0</span>
        </button>

        <div class="logo" id="logo">
            <div class="logo-mark" id="logoMark"></div>
            <div class="logo-text">
                <span class="logo-title" id="logoTitle"></span>
                <span class="logo-sub" id="logoSub"></span>
            </div>
        </div>

        <div class="top-right" id="topRight"></div>
    </header>

    <main class="wrap">
        <section class="intro" id="intro"></section>

        <section class="roster" id="rosterSection" hidden>
            <div class="roster-head">
                <h2 class="h2" data-text="rosterTitle">Участники</h2>
                <div class="roster-tools">
                    <button type="button" class="link" id="selectAll" data-text="selectAll">Выбрать все заполненные</button>
                    <button type="button" class="link" id="selectNone">Снять выбор</button>
                </div>
            </div>
            <div class="numbers" id="numbers" role="list"></div>
            <p class="hint" id="rosterHint"></p>
        </section>

        <section class="card-area" id="cardArea" hidden></section>
    </main>

    <footer class="foot">
        <span>Прототип для показа · данные хранятся только в этом браузере</span>
        <span class="foot-tools">
            <label class="theme-pick">Тема турнира
                <select id="themeSelect"></select>
            </label>
            <button type="button" class="link" id="demoBtn">Заполнить демо-данными</button>
            <button type="button" class="link danger" id="resetBtn">Сбросить всё</button>
        </span>
    </footer>

    <dialog class="modal" id="regModal">
        <form method="dialog" class="modal-body" id="regForm">
            <h2 class="h2" data-text="regTitle">Регистрация тренера</h2>
            <p class="muted">Данные тренера и турнира попадут в шапку официальной заявки.</p>
            <div class="grid2">
                <label class="field"><span>ФИО тренера *</span><input name="coach" required autocomplete="name"></label>
                <label class="field"><span>Клуб *</span><input name="club" required placeholder="Доджо …"></label>
                <label class="field"><span>Город</span><input name="city" autocomplete="address-level2"></label>
                <label class="field"><span>Телефон</span><input name="phone" type="tel" autocomplete="tel"></label>
                <label class="field wide"><span>Название турнира *</span><input name="tournament" required placeholder="Турнир «Колизей»"></label>
                <label class="field"><span>Дата турнира</span><input name="date" type="date"></label>
                <label class="field"><span>Место проведения</span><input name="place"></label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" value="cancel" id="regCancel">Отмена</button>
                <button type="submit" class="btn btn-gold" value="ok" data-text="regSubmit">Зарегистрироваться</button>
            </div>
        </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
